name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
      - name: Documentation
        run: python3 scripts/check-docs.py
      - name: First-party whitespace
        run: python3 scripts/check-whitespace.py
      - name: Formatting
        run: bash scripts/check-format.sh
      - name: Lint
        run: bash scripts/check-lint.sh
      - name: Security baseline
        run: python3 scripts/check-security.py
      - name: Dependency baseline
        run: python3 scripts/check-dependencies.py
      - name: Build
        run: xcodebuild -quiet -project Lamun.xcodeproj -scheme Lamun -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/LamunDerived" CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests
        run: xcodebuild -quiet -project Lamun.xcodeproj -scheme Lamun -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/LamunDerived" -only-testing:LamunTests CODE_SIGNING_ALLOWED=NO test
      - name: Static analysis
        run: xcodebuild -quiet -project Lamun.xcodeproj -scheme Lamun -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/LamunDerived" CODE_SIGNING_ALLOWED=NO analyze

  release-configuration:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Release configuration build
        run: xcodebuild -quiet -project Lamun.xcodeproj -scheme Lamun -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/LamunRelease" CODE_SIGNING_ALLOWED=NO build
      - name: Require a production bundle identifier before release
        run: |
          if rg -q 'org\.example\.lamun\.bootstrap' Lamun.xcodeproj/project.pbxproj; then
            echo 'Replace the temporary bundle identifier and validate release signing before merging to main.' >&2
            exit 1
          fi
